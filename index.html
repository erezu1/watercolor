    sc.onload = function(){ window.MODEL_DATA && window.MODEL_DATA[name] ? ok() : no(new Error('network')); };

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --table-a:#ddd6ca; --table-b:#c8bfb0;
  --ink:#2a2d38; --ink-soft:#5f5a50;
  --dock:rgba(251,248,241,.74); --dock-edge:rgba(70,58,40,.16);
  --chip:rgba(60,50,35,.07); --chip-on:#2a2d38; --chip-on-ink:#f8f4ea;
  --shadow:rgba(46,34,18,.34);
  --card:rgba(251,248,241,.78); --card-ink:#4a4337; --card-title:#3f382d; --glow:rgba(250,246,236,.9); --brush-blend:multiply;
  --serif:'Lora',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --table-a:#25221f; --table-b:#151311;
    --ink:#efe8da; --ink-soft:#b9b0a0;
    --dock:rgba(34,31,28,.68); --dock-edge:rgba(255,240,215,.14);
    --chip:rgba(255,240,215,.09); --chip-on:#efe8da; --chip-on-ink:#1c1a17;
    --shadow:rgba(0,0,0,.6);
    --card:rgba(34,31,28,.80); --card-ink:#e6dece; --card-title:#f3ecdf; --glow:rgba(20,18,16,.85); --brush-blend:normal;
  }
}
:root[data-theme="dark"]{
  --table-a:#25221f; --table-b:#151311;
  --ink:#efe8da; --ink-soft:#b9b0a0;
  --dock:rgba(34,31,28,.68); --dock-edge:rgba(255,240,215,.14);
  --chip:rgba(255,240,215,.09); --chip-on:#efe8da; --chip-on-ink:#1c1a17;
  --shadow:rgba(0,0,0,.6);
  --card:rgba(34,31,28,.80); --card-ink:#e6dece; --card-title:#f3ecdf; --glow:rgba(20,18,16,.85); --brush-blend:normal;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;height:100%;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 30% 20%,var(--table-a),var(--table-b)) var(--table-b);
  font-family:var(--serif);color:var(--ink);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
}
body::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
#sheet{
  position:absolute;inset:0;overflow:hidden;background:#f2ecdf;   /* the paper fills the page: no frame */
}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none;transition:opacity .45s ease}
canvas.faded{opacity:0}
canvas.instant{transition:none}
canvas:active{cursor:grabbing}
.hint{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:2;
  display:grid;justify-items:center;align-content:center;gap:8px;padding:20px 26px 18px;border-radius:22px;min-width:min(330px,86vw);min-height:180px;box-sizing:border-box;
  background:var(--card);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--dock-edge);
  box-shadow:0 10px 30px -14px var(--shadow);color:var(--card-ink);transition:opacity .9s ease;
}
.hint svg{width:120px;height:56px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hint .hint-arc{opacity:.35;stroke-dasharray:3 5}
.hint .hint-hand circle{fill:currentColor;stroke:none;opacity:.8}
.hint .hint-hand .hint-ring{fill:none;stroke:currentColor;stroke-width:1.5;opacity:.35}
.hint .hint-hand{animation:hintSwipe 2.2s ease-in-out infinite}
.hint .hint-anims{display:flex;align-items:center;gap:14px}
.hint svg.hint-pinch{width:64px}
.hint .hint-f1 circle,.hint .hint-f2 circle{fill:currentColor;stroke:none;opacity:.8}
.hint .hint-f1 .hint-ring,.hint .hint-f2 .hint-ring{fill:none;stroke:currentColor;stroke-width:1.5;opacity:.35}
.hint .hint-f1{animation:hintPinch1 2.2s ease-in-out infinite}
.hint .hint-f2{animation:hintPinch2 2.2s ease-in-out infinite}
@keyframes hintPinch1{0%,100%{transform:translate(-4px,4px)}50%{transform:translate(-12px,12px)}}
@keyframes hintPinch2{0%,100%{transform:translate(4px,-4px)}50%{transform:translate(12px,-12px)}}
.hint .hint-text{white-space:nowrap}
.hint .hint-text span{font:inherit}
.hint .hint-mouse{display:none}
@media (pointer:fine){.hint .hint-mouse{display:inline}.hint .hint-touch{display:none}}
.hint span{font-family:'Fraunces',var(--serif);font-size:17px;letter-spacing:.005em;font-variation-settings:'opsz' 24}
/* while the first painting loads, the same card welcomes you; when it arrives the welcome fades into the drag hint */
.hint .hint-anims,.hint .hint-text{transition:opacity .7s ease .25s}
.hint .hint-welcome{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:6px;padding:0 20px;text-align:center;opacity:0;transition:opacity .5s ease}
.hint .hw-title{font-size:26px;font-weight:500;line-height:1.15;text-wrap:balance;font-variation-settings:'opsz' 72;color:var(--card-title)}
.hint .hw-sub{font-size:14.5px;opacity:.7}
/* (while the first painting loads: three watercolor strokes paint themselves, one after another, and dry away) */
/* THE LOADING LANDSCAPE, on the COMPOSITOR: every stroke only MOVES (transform) and FADES (opacity) — the two things a
   browser animates off the main thread — so it keeps painting while the page is busy loading a model (drawn with
   stroke-dashoffset/stroke-width it froze with the main thread). A stroke is REVEALED left to right — its layer slides in
   while its contents slide back the same amount, so the brush mark itself stays put (no stretching) — narrow and strong,
   then soaks in: wider and lighter. One 5 s timeline */
.hw-brush{position:relative;display:block;width:250px;height:90px;margin:0 auto}
.hw-defs{position:absolute}
.hw-brush .L{position:absolute;inset:0;overflow:hidden;opacity:0;will-change:transform,opacity;mix-blend-mode:var(--brush-blend)}
.hw-brush .Li,.hw-brush .S{position:absolute;inset:0;width:100%;height:100%;overflow:visible;will-change:transform}
.hw-brush .L,.hw-brush .Li,.hw-brush .S{animation-duration:5s;animation-timing-function:cubic-bezier(.45,.05,.35,1);animation-iteration-count:infinite}
.hw-brush path{fill:none;stroke-linecap:round}
.L-sky path{stroke:#a9c6df;stroke-width:20px}.L-far path{stroke:#7f9cc0;stroke-width:10px}.L-near path{stroke:#9db27a;stroke-width:17px}
.L-t1 path,.L-t2 path,.L-t3 path{stroke:#5f7a55;stroke-width:8px}
.hint svg .L-sun circle,.L-sun circle{fill:#e8b25e;stroke:none}
.L-sun{overflow:visible}
.L-sky{animation-name:osky}.L-sky>.Li{animation-name:isky}.L-sky .S{transform-origin:50% 27.8%;animation-name:ssky}
@keyframes osky{0%,0%{transform:translateX(-100%);opacity:0}0.5%{transform:translateX(-96%);opacity:0.55}16%{transform:none;opacity:0.55}32%{transform:none;opacity:0.42}84%{transform:none;opacity:0.36}96%,100%{transform:none;opacity:0}}
@keyframes isky{0%,0%{transform:translateX(100%)}0.5%{transform:translateX(96%)}16%,100%{transform:none}}
@keyframes ssky{0%,16%{transform:scaleY(0.78)}32%,100%{transform:none}}
.L-far{animation-name:ofar}.L-far>.Li{animation-name:ifar}.L-far .S{transform-origin:50% 61.1%;animation-name:sfar}
@keyframes ofar{0%,12%{transform:translateX(-100%);opacity:0}12.5%{transform:translateX(-96%);opacity:0.7}28%{transform:none;opacity:0.7}44%{transform:none;opacity:0.55}84%{transform:none;opacity:0.48}96%,100%{transform:none;opacity:0}}
@keyframes ifar{0%,12%{transform:translateX(100%)}12.5%{transform:translateX(96%)}28%,100%{transform:none}}
@keyframes sfar{0%,28%{transform:scaleY(0.75)}44%,100%{transform:none}}
.L-sun{animation-name:osun}.L-sun .S{transform-origin:75% 30.6%;animation-name:ssun}
@keyframes osun{0%,26%{opacity:0}29%{opacity:.8}40%{opacity:.8}56%{opacity:.6}84%{opacity:.5}96%,100%{opacity:0}}
@keyframes ssun{0%,26%{transform:scale(0)}40%{transform:scale(.85)}56%{transform:scale(1)}84%,100%{transform:scale(1.08)}}
.L-near{animation-name:onear}.L-near>.Li{animation-name:inear}.L-near .S{transform-origin:50% 80.6%;animation-name:snear}
@keyframes onear{0%,34%{transform:translateX(-100%);opacity:0}34.5%{transform:translateX(-96%);opacity:0.78}50%{transform:none;opacity:0.78}66%{transform:none;opacity:0.62}84%{transform:none;opacity:0.55}96%,100%{transform:none;opacity:0}}
@keyframes inear{0%,34%{transform:translateX(100%)}34.5%{transform:translateX(96%)}50%,100%{transform:none}}
@keyframes snear{0%,50%{transform:scaleY(0.78)}66%,100%{transform:none}}
.L-t1{animation-name:ot1}.L-t1 .S{transform-origin:21.0% 77.8%;animation-name:st1}
@keyframes ot1{0%,52%{opacity:0}52.5%{opacity:.9}70%{opacity:.75}84%{opacity:.65}96%,100%{opacity:0}}
@keyframes st1{0%,52%{transform:scale(.7,0)}57%{transform:scale(.7,1)}70%,100%{transform:none}}
.L-t2{animation-name:ot2}.L-t2 .S{transform-origin:25.5% 79.2%;animation-name:st2}
@keyframes ot2{0%,56%{opacity:0}56.5%{opacity:.9}74%{opacity:.75}84%{opacity:.65}96%,100%{opacity:0}}
@keyframes st2{0%,56%{transform:scale(.7,0)}61%{transform:scale(.7,1)}74%,100%{transform:none}}
.L-t3{animation-name:ot3}.L-t3 .S{transform-origin:68.5% 77.8%;animation-name:st3}
@keyframes ot3{0%,60%{opacity:0}60.5%{opacity:.9}78%{opacity:.75}84%{opacity:.65}96%,100%{opacity:0}}
@keyframes st3{0%,60%{transform:scale(.7,0)}65%{transform:scale(.7,1)}78%,100%{transform:none}}
.hint.welcome .hint-welcome{opacity:1}
.hint.welcome .hint-anims,.hint.welcome .hint-text{opacity:0;transition:none}
@keyframes hintSwipe{0%,100%{transform:translateX(-30px)}50%{transform:translateX(30px)}}
/* (the same card while another painting is prepared: its name, the brush strokes) */
.hint.loadcard{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s;gap:6px}
.hint.loadcard.on{opacity:1;visibility:visible;transition:opacity .45s ease}
body.menu-open .hint.loadcard{opacity:0}
.hint.gone{opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s linear .9s}   /* (really gone once faded: an invisible blurred card still showed as a rectangle through the menu's blur) */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(186px + env(safe-area-inset-bottom,0px));
  font-style:italic;font-size:18px;color:var(--card-ink);pointer-events:none;opacity:0;transition:opacity .5s ease;white-space:nowrap;
  text-shadow:0 0 12px var(--glow);
}
.toast.on{opacity:1}

.menu-btn{
  position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));
  width:48px;height:48px;border-radius:50%;border:1px solid var(--dock-edge);background:var(--dock);color:var(--ink);
  -webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);
  box-shadow:0 8px 22px -10px var(--shadow);display:grid;place-items:center;cursor:pointer;padding:0;z-index:3;
}
.menu-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.menu-btn .dot{fill:currentColor;stroke:none}
.menu-btn:focus-visible{outline:2px solid #4a5da8;outline-offset:2px}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body.menu-open .toast{opacity:0}
.fail{position:absolute;inset:0;display:none;place-items:center;padding:32px;text-align:center;font-size:20px;font-style:italic;color:#5d5547}


/* ---- the two buttons: painting (bottom left), settings (bottom right) ---- */
.pick-btn{                                             /* a framed painting: opens the chooser */
  position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:3;
  appearance:none;cursor:pointer;width:48px;height:48px;border-radius:50%;padding:0;display:grid;place-items:center;
  border:1px solid var(--dock-edge);background:var(--dock);color:var(--ink);
  -webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);box-shadow:0 8px 22px -10px var(--shadow);
}
.pick-btn svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pick-btn .dot{fill:currentColor;stroke:none}
/* the icon turns into the "x" and back: one rotates and shrinks away while the other turns in */
.pick-btn .i-open,.pick-btn .i-close,.menu-btn .i-open,.menu-btn .i-close{transform-box:view-box;transform-origin:50% 50%;
  transition:opacity .22s ease,transform .32s cubic-bezier(.3,.7,.3,1)}
.pick-btn .i-close,.menu-btn .i-close{opacity:0;transform:rotate(-90deg) scale(.5)}
.pick-btn[aria-expanded="true"] .i-open,.menu-btn[aria-expanded="true"] .i-open{opacity:0;transform:rotate(90deg) scale(.5)}
.pick-btn[aria-expanded="true"] .i-close,.menu-btn[aria-expanded="true"] .i-close{opacity:1;transform:none}

/* ---- panels ---- */
.panel{
  position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:3;
  width:min(calc(100% - 48px),360px);max-height:calc(100% - 120px);overflow:auto;
  padding:18px 18px 16px;border-radius:20px;display:grid;gap:16px;
  background:var(--dock);border:1px solid var(--dock-edge);
  -webkit-backdrop-filter:blur(18px) saturate(1.25);backdrop-filter:blur(18px) saturate(1.25);
  box-shadow:0 18px 40px -16px var(--shadow);animation:panelIn .22s ease;
}
.panel[hidden]{display:none}
.picker{left:calc(24px + env(safe-area-inset-left,0px));transform-origin:0 100%}
.settings{right:calc(24px + env(safe-area-inset-right,0px));transform-origin:100% 100%}
@keyframes panelIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.panel.closing{animation:panelOut .2s ease forwards;pointer-events:none}   /* (a menu fades away the way it came) */
@keyframes panelOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(8px) scale(.98)}}
.panel h2{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
.picker h2{margin:0}
.choices{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.choices button{
  appearance:none;border:0;background:transparent;color:var(--ink);font-family:var(--serif);text-align:left;cursor:pointer;
  width:100%;display:grid;grid-template-columns:64px 1fr;align-items:center;gap:0 14px;padding:6px;border-radius:14px;transition:background .2s ease;
}
.choices button:hover{background:var(--chip)}
.choices button[aria-current="true"]{background:var(--chip)}
.choices img{width:64px;height:64px;border-radius:10px;object-fit:cover}
.choices .t{display:block;font-size:18px;font-style:italic;font-weight:500;line-height:1.15}
.choices .d{display:block;font-size:14.5px;color:var(--ink-soft);line-height:1.25;margin-top:2px}
.choices button[aria-current="true"] img{box-shadow:0 0 0 2px var(--dock),0 0 0 3.5px var(--ink)}
.credits{border-top:1px solid var(--dock-edge);padding-top:12px;font-size:13.5px;line-height:1.4;color:var(--ink-soft)}
.credits p{margin:0}
.credits a{color:inherit;text-underline-offset:2px}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mood{
  appearance:none;border:0;background:transparent;cursor:pointer;padding:6px 0 4px;border-radius:12px;font-family:var(--serif);color:var(--ink);
  display:grid;justify-items:center;gap:6px;transition:background .2s ease;
}
.mood:hover{background:var(--chip)}
.mood i{width:34px;height:34px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(40,30,15,.22)}
.mood span{font-size:14px;font-style:italic;color:var(--ink-soft)}
.mood[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--dock),0 0 0 3.5px var(--ink)}
.mood[aria-pressed="true"] span{color:var(--ink)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:999px;border:1px solid var(--dock-edge);isolation:isolate}
.seg button{appearance:none;border:0;background:transparent;cursor:pointer;font-family:var(--serif);color:var(--ink-soft);
  display:grid;justify-items:center;gap:1px;padding:7px 6px 6px;border-radius:999px;transition:color .25s ease;z-index:1}
.seg button b{font-size:16px;font-weight:500;font-style:italic}
.seg button span{font-size:12px;line-height:1.2}
.seg button[aria-checked="true"]{color:var(--ink)}
.seg-thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--chip);
  box-shadow:inset 0 0 0 1px var(--dock-edge);transition:transform .3s cubic-bezier(.3,.7,.2,1);z-index:0}
.seg[data-v="cont"] .seg-thumb{transform:translateX(100%)}
.seg button:hover{color:var(--ink)}
.seg button:focus-visible{outline:2px solid #4a5da8;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.seg-thumb{transition:none}}
.peek{
  appearance:none;border:1px solid var(--dock-edge);background:transparent;color:var(--ink);cursor:pointer;font-family:var(--serif);
  display:flex;align-items:center;justify-content:center;gap:10px;height:44px;border-radius:999px;font-size:16.5px;font-weight:500;
  -webkit-user-select:none;user-select:none;touch-action:none;transition:background .2s ease,color .2s ease;
}
.peek svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
/* while 'hold to see the model' is held, the menu and buttons fade away (the whole model is visible), and come back */
.panel,.pick-btn,.menu-btn{transition:opacity .25s ease}
body.peeking .panel,body.peeking .pick-btn,body.peeking .menu-btn{opacity:0}
.about{margin:0;font-size:14px;font-style:italic;line-height:1.4;color:var(--ink-soft);text-align:center}
.pick-btn:focus-visible,.choices button:focus-visible,.mood:focus-visible,.peek:focus-visible,canvas:focus-visible{outline:2px solid #4a5da8;outline-offset:2px}

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ */
/*  Setup                                                              */
/* ------------------------------------------------------------------ */
const $ = id => document.getElementById(id);
const sheet = $('sheet'), canvas = $('c');
// THE PAINTED FALLBACK (a phone without WebGL 2, or missing what the painter needs): the paintings as they are painted,
// pre-rendered at 24 angles round each (tools: frames.mjs → frames/<id>/NN.jpg) — dragging turns them a step at a time.
// It needs nothing but images, so it works in any browser; the reason stays in small print below.
const FALLBACK = [['lighthouse','The Lighthouse'],['mill3','The Dutch Mill'],['pavilion','The Pavilion'],['cats','The Cat Trio'],['mill2','The Windmill'],
  ['moomin','The Moomin House'],['bridge','The Japanese Bridge'],['medieval','The Hill Castle'],['castle','The Floating Castle']], FB_N = 24;
function fallbackView(why){
  canvas.style.display = 'none'; ['hint','fail','loadcard'].forEach(k => { const e = $(k); if(e) e.style.display = 'none'; });
  ['dock','picker'].forEach(k => { const e = $(k); if(e) e.hidden = true; }); ['menuBtn','pickBtn'].forEach(k => { const e = $(k); if(e) e.style.display = 'none'; });
  const root = document.createElement('div'); root.id = 'fallback';
  root.style.cssText = 'position:absolute;inset:0;display:grid;grid-template-rows:1fr auto auto;background:#f3eee3;touch-action:none;user-select:none;-webkit-user-select:none';
  const img = document.createElement('img'); img.alt = ''; img.draggable = false;
  img.style.cssText = 'width:100%;height:100%;object-fit:contain;min-height:0;pointer-events:none';
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;overflow-x:auto;padding:10px 14px calc(8px + env(safe-area-inset-bottom,0px));scrollbar-width:none';
  const note = document.createElement('div');
  note.style.cssText = 'font:italic 13px/1.35 Lora,Georgia,serif;color:#7a705f;text-align:center;padding:0 18px calc(10px + env(safe-area-inset-bottom,0px))';
  note.innerHTML = 'Drag to turn · a pre-painted view, as this browser can’t run the live painting' + (why ? '<br><span style="opacity:.75">(' + why + ')</span>' : '');
  root.append(img, row, note); (document.getElementById('sheet') || document.body).appendChild(root);
  let cur = null, frames = [], k = 0, acc = 0;
  const show = () => { const f = frames[k]; if(f && f.complete && f.naturalWidth) img.src = f.src; };
  const pick = id => { cur = id; k = 0; frames = []; for(let i=0;i<FB_N;i++){ const im = new Image(); im.src = 'frames/' + id + '/' + String(i).padStart(2,'0') + '.jpg'; if(i === 0) im.onload = show; frames.push(im); }
    img.src = frames[0].src; [...row.children].forEach(b => b.style.outline = b.dataset.id === id ? '2px solid #4a4337' : 'none'); };
  for(const [id, title] of FALLBACK){ const b = document.createElement('button'); b.dataset.id = id; b.title = title; b.setAttribute('aria-label', title);
    b.style.cssText = 'flex:0 0 auto;width:58px;height:58px;border:0;padding:0;border-radius:10px;cursor:pointer;background:#e6dece center/cover no-repeat;outline-offset:2px';
    if(window.THUMBS && window.THUMBS[id]) b.style.backgroundImage = 'url(' + window.THUMBS[id] + ')';
    b.onclick = () => pick(id); row.appendChild(b); }
  let down = null;
  img.parentNode.addEventListener('pointerdown', e => { if(e.target.closest('button')) return; down = e.clientX; acc = 0; });
  addEventListener('pointermove', e => { if(down === null) return; acc += e.clientX - down; down = e.clientX;
    const step = Math.max(14, innerWidth/40); while(Math.abs(acc) >= step){ const d = acc > 0 ? 1 : -1; acc -= d*step; k = (k - d + FB_N) % FB_N; show(); } });
  addEventListener('pointerup', () => { down = null; }); addEventListener('pointercancel', () => { down = null; });
  pick(FALLBACK[0][0]);
}
function fail(why){ if(!window.__fbShown && !OPT.noFallback){ window.__fbShown = 1; fallbackView(why); return; } if(why) $('fail').innerHTML = 'This painting needs graphics features this device doesn’t offer.<br><small style="opacity:.7">'+why+'</small>'; $('fail').style.display='grid'; canvas.style.display='none'; $('hint').style.display='none'; $('dock').hidden=true; $('picker').hidden=true; $('menuBtn').style.display='none'; $('pickBtn').style.display='none'; }
if(!window.THREE){ fail(); return; }
const THREE = window.THREE;
const OPT = window.__OPT = Object.assign({ quad:1, cull:1, early:1, sort:1, skipPlan:1, strokeEarly:1, wetEarly:1, resolveDead:1 }, (()=>{ try{ return JSON.parse(new URLSearchParams(location.search).get('opt') || '{}'); }catch(e){ return {}; } })());   // speed-ups (all exact: same picture); each can be switched off for A/B tests with ?opt={"quad":0,...}
// (a phone: see intScale and quality below; ?mobile forces the phone mode on a desktop, for tests)
const PHONE = /[?&]mobile\b/.test(location.search) || (()=>{ try{ return matchMedia('(pointer:coarse)').matches && Math.min(screen.width, screen.height) < 900; }catch(e){ return false; } })();
const QS = new URLSearchParams(location.search);

let renderer;
// WEBGL 2, asked for gently: first the fast GPU, then with no preference (a few drivers refuse 'high-performance'), then
// accepting a slow one. Not found: the card says what the browser does offer, so the cause can be told apart
let gl2 = null;
if(new URLSearchParams(location.search).has('fallback')){ fail('shown on purpose: ?fallback'); return; }   // (to see the pre-painted fallback on any device)
for(const a of [{ powerPreference:'high-performance' }, {}, { failIfMajorPerformanceCaveat:false, powerPreference:'low-power' }]){
  try{ gl2 = canvas.getContext('webgl2', Object.assign({ antialias:false, alpha:false, depth:true, stencil:false, premultipliedAlpha:true, preserveDrawingBuffer:false }, a)); }catch(e){ gl2 = null; }
  if(gl2) break; }
if(!gl2){ let why = 'WebGL 2 is not available in this browser';
  try{ const g1 = document.createElement('canvas').getContext('webgl'); if(g1){ const di = g1.getExtension('WEBGL_debug_renderer_info');
      why += ' (only WebGL 1: ' + (di ? g1.getParameter(di.UNMASKED_RENDERER_WEBGL) : g1.getParameter(g1.RENDERER)) + ')'; }
    else why += ' — WebGL is switched off: try restarting the browser (Chrome turns it off for a site after graphics crashes), or turn on hardware acceleration'; }catch(e){}
  fail(why); return; }
try{
  renderer = new THREE.WebGLRenderer({canvas, context:gl2, antialias:false, alpha:false});
}catch(e){ fail('the graphics context could not start: ' + (e && e.message || e)); return; }
if(!renderer.capabilities.isWebGL2){ fail('WebGL 2 is not available in this browser'); return; }
// (what the painter needs beyond WebGL 2: rendering into float textures, 6 outputs at once, gzip in the browser — say which
// one is missing instead of a blank page; a friend's phone showed only the paper)
{ const gl = renderer.getContext(), miss = [];
  const f32 = !!gl.getExtension('EXT_color_buffer_float'), f16 = f32 || !!gl.getExtension('EXT_color_buffer_half_float');
  window.__F32 = f32 && !OPT.half;   // (no 32-bit float rendering: the stroke memory falls back to half floats — ~0.5 px steps, still paints)
  if(!f16) miss.push('float render targets (EXT_color_buffer_float / half_float)');
  const mdb = gl.getParameter(gl.MAX_DRAW_BUFFERS); if(mdb < 4) miss.push('4 draw buffers (has '+mdb+')');
  if(miss.length){ fail(miss.join(' · ') + ' — ' + (gl.getParameter(gl.RENDERER) || '')); return; } }
// LITE (user: older phones that can run it, but slowly): about half the strokes, each bigger (faces short of strokes grow
// theirs to cover), a smaller stroke memory, a lower painting resolution, the plan followed less often. Decided before
// anything is built: the number of strokes can't change later without starting the painting over. Chosen by a weak or
// software GPU, <= 4 GB of memory, or this device having been too slow before (localStorage 'wc-lite', set by the
// slow-frame guard); ?lite forces it, ?lite=0 forbids it (and forgets the remembered choice).
const GPU = (()=>{ try{ const gl = renderer.getContext(), di = gl.getExtension('WEBGL_debug_renderer_info'); return String(di ? gl.getParameter(di.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)); }catch(e){ return ''; } })();
function weakGPU(g){
  if(/SwiftShader|llvmpipe|softpipe|Software|Basic Render/i.test(g)) return true;
  let m = g.match(/Adreno\D*(\d{3})/i); if(m){ const n = +m[1]; return n < 640 || (n >= 700 && n < 720); }   // (Adreno 3xx–630: 2014–2019; 702/710: today's budget phones)
  m = g.match(/Mali-?\s*(T\d+|G\d+|\d{3})/i); if(m) return /^(T|\d)/i.test(m[1]) || /^G(31|51|52|57|68|71|72|76)$/i.test(m[1]);   // (Mali T and 400-series, the budget Gs, the 2017–19 flagship Gs)
  return /PowerVR Rogue|GE8\d{3}|GX6\d{3}|GM9\d{3}/i.test(g);   // (PowerVR's older Rogue line: the Pixel 10's D-Series is not one)
}
const LITE = (()=>{ const q = QS.get('lite');
  if(q !== null){ try{ if(q === '0') localStorage.removeItem('wc-lite'); }catch(e){} return q !== '0'; }
  let mem = false; try{ mem = localStorage.getItem('wc-lite') === '1'; }catch(e){}
  return mem || weakGPU(GPU) || (navigator.deviceMemory > 0 && navigator.deviceMemory <= 4); })();
if(OPT.halfPlan === undefined) OPT.halfPlan = LITE ? 2 : PHONE ? 1 : 0;   // (every phone: confirmed smooth on the user's phone; n: n light frames per full plan; lite: 2)
if(OPT.fence === undefined) OPT.fence = PHONE || LITE ? 2 : 0;   // (n: at most n frames queued on the GPU. Phone, measured: 2 = same mean as none, but no 100+ ms stalls; 1 = slower)
if(OPT.settleEvery === undefined) OPT.settleEvery = LITE ? 3 : PHONE ? 2 : 1;   // (while strokes settle, the plan follows the paint every n-th frame)   // (while the view moves, the full plan every other frame; the anchors every frame)
// THE GPU CONTEXT LOST (a low-memory phone reclaims it, or the app was in the background): no dead canvas — a card that
// reloads the page on a tap
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); const f = $('fail');
